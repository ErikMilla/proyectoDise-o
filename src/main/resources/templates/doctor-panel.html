<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del Doctor</title>
    <link rel="stylesheet" th:href="@{/styleLogin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .doctor-card {
            border-radius: 24px;
            box-shadow: 0 2px 16px #e0e7ef;
            background: #fff;
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 90px;
            max-width: 900px;
        }
        .table th, .table td { vertical-align: middle; }
        .main-btn { background: #399fad; color: #fff; border-radius: 14px; font-size: 1rem; padding: 0.5rem 1.2rem; border: none; }
        .main-btn:active, .main-btn:focus { background: #2e8c99; }
        /* Navbar-bottom igual que en las páginas principales */
        .navbar-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            background: #f7fafb;
            border-top: 1px solid #e0e7ef;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 64px;
            z-index: 1000;
        }
        .navbar-bottom a {
            color: #399fad;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar-bottom a.active,
        .navbar-bottom a:focus {
            color: #2e8c99;
        }
        .navbar-bottom i {
            font-size: 1.5rem;
        }
        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .doctor-card {
                max-width: 100%;
                padding: 1rem;
                margin-top: 1rem;
            }
        }
        @media (max-width: 600px) {
            .doctor-card {
                padding: 0.5rem;
                border-radius: 12px;
                margin-top: 0.5rem;
            }
            .table-responsive {
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .table {
                min-width: 600px;
                font-size: 0.92rem;
            }
            .table th, .table td {
                padding: 8px 6px;
            }
            h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container" style="padding-bottom: 80px;">
        <div class="doctor-card mx-auto" style="max-width: 900px;">
            <h2 class="mb-4 text-center">Panel de Monitoreo de Pacientes</h2>
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellidos</th>
                            <th>Email</th>
                            <th>Teléfono</th>
                            <th>Dirección</th>
                            <th>Contacto Emergencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="paciente : ${pacientes}">
                            <td th:text="${paciente.nombre}"></td>
                            <td th:text="${paciente.apellidos}"></td>
                            <td th:text="${paciente.email}"></td>
                            <td th:text="${paciente.telefono}"></td>
                            <td th:text="${paciente.direccion}"></td>
                            <td th:text="${paciente.contactoEmergencia}"></td>
                            <td>
                                <a th:href="@{'/doctor/pacientes/' + ${paciente.id}}" class="btn-detalles">
                                    <i class="bi bi-eye"></i>
                                    <span>Ver detalles</span>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <nav class="navbar-bottom">
        <a href="/doctor/pacientes" class="active"><i class="bi bi-people"></i><span>Pacientes</span></a>
        <a href="/logout"><i class="bi bi-box-arrow-right"></i><span>Salir</span></a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
