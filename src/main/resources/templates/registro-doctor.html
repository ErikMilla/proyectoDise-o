<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Doctor - Aplicación Diseño</title>
    <link rel="stylesheet" th:href="@{/styleLogin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="login-header">
                <h2>Registro de Doctor</h2>
                <p>Completa tus datos para registrarte como doctor</p>
            </div>

            <form th:action="@{/registro-doctor}" th:object="${registroDoctorDto}" method="post" class="needs-validation" novalidate>
                <!-- Mensajes de error dentro del form -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                    <ul>
                        <li th:each="error : ${#fields.errors('*')}" th:text="${error}"></li>
                    </ul>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <input class="form-control" th:field="*{nombre}" type="text" placeholder="Nombre" required>
                        <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
                    </div>
                    <div class="col-md-6">
                        <input class="form-control" th:field="*{apellidos}" type="text" placeholder="Apellidos" required>
                        <div th:if="${#fields.hasErrors('apellidos')}" class="text-danger" th:errors="*{apellidos}"></div>
                    </div>
                </div>

                <input class="form-control" th:field="*{email}" type="email" placeholder="Correo electrónico" required>
                <div th:if="${#fields.hasErrors('email')}" class="text-danger" th:errors="*{email}"></div>

                <input class="form-control" th:field="*{telefono}" type="tel" placeholder="Teléfono">

                <input class="form-control" th:field="*{direccion}" type="text" placeholder="Dirección" required>
                <div th:if="${#fields.hasErrors('direccion')}" class="text-danger" th:errors="*{direccion}"></div>

                <input class="form-control" th:field="*{contactoEmergencia}" type="tel" placeholder="Contacto de emergencia" required>
                <div th:if="${#fields.hasErrors('contactoEmergencia')}" class="text-danger" th:errors="*{contactoEmergencia}"></div>

                <!-- Campo específico para doctores -->
                <input class="form-control" th:field="*{numeroColegiatura}" type="text" placeholder="Número de colegiatura" required>
                <div th:if="${#fields.hasErrors('numeroColegiatura')}" class="text-danger" th:errors="*{numeroColegiatura}"></div>

                <input class="form-control" th:field="*{contraseña}" type="password" placeholder="Contraseña" required>
                <div th:if="${#fields.hasErrors('contraseña')}" class="text-danger" th:errors="*{contraseña}"></div>

                <input class="form-control" th:field="*{confircontraseña}" type="password" placeholder="Confirmar contraseña" required>
                <div th:if="${#fields.hasErrors('confircontraseña')}" class="text-danger" th:errors="*{confircontraseña}"></div>

                <button type="submit" class="main-btn">Registrarse como Doctor</button>
            </form>

            <div class="text-center mt-3">
                <span>¿Ya tienes una cuenta? <a href="/login" class="login-link">Iniciar sesión</a></span>
            </div>
            
            <div class="text-center mt-2">
                <span>¿Eres paciente? <a href="/registro" class="login-link">Registro de paciente</a></span>
            </div>
        </div>
    </div>
    
    <nav class="navbar-bottom">
        <a href="/"><i class="bi bi-house-door"></i><span>Inicio</span></a>
        <a href="/login"><i class="bi bi-box-arrow-in-right"></i><span>Iniciar sesión</span></a>
        <a href="/registro"><i class="bi bi-person-plus"></i><span>Registro Paciente</span></a>
        <a href="/registro-doctor" class="active"><i class="bi bi-person-badge"></i><span>Registro Doctor</span></a>
    </nav>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
