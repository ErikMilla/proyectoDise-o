<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones</title>
    <link rel="stylesheet" th:href="@{/styleLogin.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .noti-card {
            border-radius: 24px;
            box-shadow: 0 2px 16px #e0e7ef;
            background: #fff;
            padding: 2rem;
            margin-top: 2rem;
            margin-bottom: 90px;
            max-width: 600px;
        }
        .noti-section-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .noti-item {
            margin-bottom: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 1px 6px #e0e7ef;
            padding: 1rem 1.2rem;
            background: #f7fafb;
        }
        .noti-comentario {
            border-left: 4px solid #399fad;
        }
        .noti-comentario .noti-title {
            color: #399fad;
            font-weight: bold;
        }
        .noti-comentario .noti-icon {
            color: #399fad;
            font-size: 1.2rem;
        }
        .noti-alerta {
            border-left: 4px solid #ffc107;
            background: #fffbe6;
        }
        .noti-alerta .noti-title {
            color: #ffc107;
            font-weight: bold;
        }
        .noti-alerta .noti-icon {
            color: #ffc107;
            font-size: 1.2rem;
        }
        .noti-date {
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 0.3rem;
        }
        .noti-empty {
            color: #aaa;
            text-align: center;
            margin: 2rem 0;
        }
        
        /* Estilos de la navbar-bottom igual que en index.html */
        .navbar-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            background: #f7fafb;
            border-top: 1px solid #e0e7ef;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 64px;
            z-index: 1000;
        }

        .navbar-bottom a {
            color: #399fad;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar-bottom a.active,
        .navbar-bottom a:focus {
            color: #2e8c99;
        }

        .navbar-bottom i {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container" style="padding-bottom: 80px;">
        <div class="noti-card mx-auto">
            <div class="noti-section-title"><i class="bi bi-chat-dots"></i> Comentarios médicos</div>
            <div th:if="${comentarios != null && #lists.size(comentarios) > 0}">
                <div th:each="comentario : ${comentarios}" class="noti-item noti-comentario">
                    <div class="noti-title"><span class="noti-icon"><i class="bi bi-person-badge"></i></span> Nota de <span th:text="${comentario.doctor.nombre}"></span></div>
                    <div class="noti-date" th:text="${#temporals.format(comentario.fechaComentario, 'dd/MM/yyyy HH:mm')}"></div>
                    <div th:text="${comentario.texto}"></div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(comentarios)}" class="noti-empty">
                <span>No tienes comentarios médicos aún.</span>
            </div>
            <hr>
            <div class="noti-section-title"><i class="bi bi-exclamation-triangle"></i> Alertas recientes</div>
            <div th:if="${alertas != null && #lists.size(alertas) > 0}">
                <div th:each="alerta : ${alertas}" class="noti-item noti-alerta">
                    <div class="noti-title"><span class="noti-icon"><i class="bi bi-exclamation-triangle"></i></span> <span th:text="${alerta.tipoAlerta}"></span></div>
                    <div class="noti-date" th:text="${#temporals.format(alerta.fechaHora, 'dd/MM/yyyy HH:mm')}"></div>
                    <div><b>Valor detectado:</b> <span th:text="${alerta.valorDetectado}"></span></div>
                    <div><b>Contacto notificado:</b> <span th:text="${alerta.contactoNotificado}"></span></div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(alertas)}" class="noti-empty">
                <span>No tienes alertas recientes.</span>
            </div>
        </div>
    </div>
    <nav class="navbar-bottom">
        <a href="/" th:classappend="${activePage == 'inicio'} ? 'active' : ''"><i class="bi bi-house-door"></i><span>Inicio</span></a>
        <a href="/notificaciones" th:classappend="${activePage == 'notificaciones'} ? 'active' : ''"><i class="bi bi-bell"></i><span>Notificaciones</span></a>
        <a href="/ajustes" th:classappend="${activePage == 'ajustes'} ? 'active' : ''"><i class="bi bi-gear"></i><span>Ajustes</span></a>

        <!-- Si no está autenticado -->
        <a th:if="${nombreUsuario == null}" href="/login"><i class="bi bi-box-arrow-in-right"></i><span>Iniciar Sesión</span></a>
        <a th:if="${nombreUsuario == null}" href="/registro"><i class="bi bi-person-plus"></i><span>Registrarse</span></a>

        <!-- Si está autenticado -->
        <a th:if="${nombreUsuario != null}" href="/medicion"><i class="bi bi-heart-pulse"></i><span>Salud</span></a>
        <a th:if="${nombreUsuario != null}" href="/alertas"><i class="bi bi-exclamation-triangle"></i><span>Alertas</span></a>
        <a th:if="${nombreUsuario != null}" href="/logout"><i class="bi bi-box-arrow-right"></i><span>Salir</span></a>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
